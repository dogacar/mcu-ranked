<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OUR WATCHLIST</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0c11;
    --panel: #12151d;
    --panel-line: #1f2430;
    --gold: #d4a017;
    --gold-bright: #f2c94c;
    --rose: #e0719a;
    --text: #e8e6df;
    --text-dim: #7d8394;
    --spine: #2a3040;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100%;
  }
  body{ padding-bottom: 60px; }

  header{
    position: sticky; top:0; z-index: 10;
    background: linear-gradient(180deg, rgba(10,12,17,1) 70%, rgba(10,12,17,0.92));
    backdrop-filter: blur(6px);
    padding: 20px 20px 0;
    border-bottom: 1px solid var(--panel-line);
  }
  .head-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  h1{
    font-family:'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 2px;
    margin: 0;
    line-height: 1;
    color: var(--gold-bright);
  }
  .whoami{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel);
    border: 1px solid var(--panel-line);
    border-radius: 20px;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
    flex: none;
  }
  .stats{
    margin-top: 12px;
    display:flex; gap: 18px; align-items:flex-end;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
  }
  .stats b{ color: var(--gold-bright); font-size: 15px; display:block; }
  .sync{
    margin-left:auto;
    font-size: 10px;
    background:none; border:none; color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    cursor:pointer; padding: 4px 0;
  }

  .tabs{
    display:flex; gap: 4px;
    margin-top: 14px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: none;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    padding: 10px 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active{ color: var(--gold-bright); border-bottom-color: var(--gold); }

  main{ padding: 10px 16px 0; max-width: 640px; margin: 0 auto; }

  .timeline{ position: relative; display:none; }
  .timeline.active{ display:block; }
  .timeline:not(.empty)::before{
    content:"";
    position:absolute;
    left: 27px; top: 8px; bottom: 8px;
    width: 2px;
    background: var(--spine);
  }

  .empty-state{
    text-align:center;
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.7;
    padding: 60px 20px;
  }

  .card{
    position: relative;
    display:flex;
    gap: 14px;
    padding: 16px 0 16px 54px;
    border-bottom: 1px solid var(--panel-line);
  }

  .idx{
    position:absolute;
    left: 0; top: 18px;
    width: 56px;
  }
  .idx .dot{
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--bg);
    position: absolute; left: 21px; top: 0;
    box-shadow: 0 0 0 2px var(--spine);
  }

  .poster{
    flex: none;
    width: 64px; height: 96px;
    border-radius: 6px;
    background: var(--panel);
    background-size: cover;
    background-position: center;
    border: 1px solid var(--panel-line);
  }

  .info{ flex: 1; min-width: 0; }
  .title{ font-size: 16px; font-weight: 600; line-height: 1.25; }
  .year{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 3px;
  }

  .rate-row{
    margin-top: 10px;
    display:flex; align-items:center; gap: 8px;
    flex-wrap: wrap;
  }
  .rate-row input[type="text"]{
    width: 52px;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--gold-bright);
    font-family:'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    padding: 6px 4px;
    border-radius: 6px;
    text-align:center;
  }
  .rate-row input[type="text"]:focus{ outline: none; border-color: var(--gold); }
  .rate-row .max{ color: var(--text-dim); font-size: 12px; font-family:'JetBrains Mono', monospace; }
  .clear-btn{
    background: none; border: none;
    color: var(--text-dim);
    font-size: 11px;
    font-family:'JetBrains Mono', monospace;
    cursor: pointer;
    padding: 4px 6px;
    visibility: hidden;
  }
  .card.rated .clear-btn{ visibility: visible; }
  .card.rated .rate-row input[type="text"]{ border-color: var(--gold); }

  .badge{
    display: none;
    align-items: center;
    gap: 5px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 8px;
    border-radius: 6px;
    white-space: nowrap;
  }
  .badge.show{ display: inline-flex; }
  .badge .tag{
    font-size: 9px;
    font-weight: 800;
    padding: 1px 3px;
    border-radius: 3px;
    letter-spacing: 0.3px;
    color: #000;
  }
  .imdb-badge{
    color: #f5c518;
    background: rgba(245, 197, 24, 0.1);
    border: 1px solid rgba(245, 197, 24, 0.3);
  }
  .imdb-badge .tag{ background: #f5c518; }
  .partner-badge{
    color: var(--rose);
    background: rgba(224, 113, 154, 0.1);
    border: 1px solid rgba(224, 113, 154, 0.3);
  }
  .partner-badge .tag{ background: var(--rose); }

  footer{
    text-align:center;
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 30px 20px 10px;
  }

  /* Who-are-you picker */
  .overlay{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,12,17,0.96);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
  }
  .overlay.show{ display:flex; }
  .picker{ text-align:center; max-width: 320px; width:100%; }
  .picker h2{
    font-family:'Bebas Neue', sans-serif;
    font-size: 30px; letter-spacing: 1px;
    color: var(--gold-bright); margin: 0 0 6px;
  }
  .picker p{
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px; margin: 0 0 24px;
  }
  .picker button{
    display:block; width:100%;
    background: var(--panel);
    border: 1px solid var(--panel-line);
    color: var(--text);
    font-family:'Inter', sans-serif;
    font-size: 16px; font-weight: 600;
    padding: 16px; margin-bottom: 10px;
    border-radius: 10px; cursor:pointer;
  }
  .picker button:active{ border-color: var(--gold); }
</style>
</head>

  <div class="picker">

    key: "potter",

  },
  {

      { id:"sr-innocence-2026", title:"Museum of Innocence", year:2026, wiki:"Masumiyet Müzesi", imdbId:"tt34692373" }

/* ============================================================
   3. APP CODE — you shouldn't need to touch anything below
   ============================================================ */

const ME_KEY = "wl-me-v1";
const LOCAL_KEY = "wl-ratings-v1";
const IMDB_CACHE_KEY = "wl-imdb-cache-v1";

function readJSON(key, fallback){
  try { return JSON.parse(localStorage.getItem(key)) || fallback; }
  catch(e){ return fallback; }
}
function writeJSON(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
}

// all ratings: { p1: {itemId: score}, p2: {itemId: score} }
let allRatings = readJSON(LOCAL_KEY, {});
let imdbCache  = readJSON(IMDB_CACHE_KEY, {});
let meId       = localStorage.getItem(ME_KEY) || null;

function me(){ return PEOPLE.find(p => p.id === meId) || PEOPLE[0]; }
function partner(){ return PEOPLE.find(p => p.id !== meId) || PEOPLE[1]; }
function myScores(){ return allRatings[meId] || {}; }
function partnerScores(){ return allRatings[partner().id] || {}; }

const dbReady = () =>
  FIREBASE_DB_URL && FIREBASE_DB_URL.indexOf("PASTE_") === -1;

function setSyncLabel(text){
  document.getElementById("syncBtn").textContent = text;
}

// ---- Firebase (plain REST, no SDK needed) ----
async function pullFromCloud(){
  if(!dbReady()){ setSyncLabel("local only"); return; }
  setSyncLabel("syncing…");
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/ratings.json`);
    const data = await res.json();
    if(data && typeof data === "object"){
      allRatings = data;
      writeJSON(LOCAL_KEY, allRatings);
    }
    setSyncLabel("refresh");
    renderAll();
  }catch(e){
    setSyncLabel("offline");
  }
}

async function pushOne(itemId, value){
  // keep local copy first so nothing is lost if the network fails
  if(!allRatings[meId]) allRatings[meId] = {};
  if(value === null) delete allRatings[meId][itemId];
  else allRatings[meId][itemId] = value;
  writeJSON(LOCAL_KEY, allRatings);

  if(!dbReady()) return;
  try{
    await fetch(`${FIREBASE_DB_URL}/ratings/${meId}.json`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ [itemId]: value })
    });
    setSyncLabel("saved ✓");
    setTimeout(() => setSyncLabel("refresh"), 1200);
  }catch(e){
    setSyncLabel("offline");
  }
}

// ---- IMDb ----
function imdbUrl(item){
  if(item.imdbId) return `https://www.omdbapi.com/?i=${item.imdbId}&apikey=${OMDB_API_KEY}`;
  const t = encodeURIComponent(item.omdb || item.title);
  return `https://www.omdbapi.com/?t=${t}&y=${item.year}&apikey=${OMDB_API_KEY}`;
}

function revealImdb(item, badgeEl){
  if(!badgeEl) return;
  const cached = imdbCache[item.id];
  if(cached){ showBadge(badgeEl, cached); return; }
  if(!OMDB_API_KEY) return;
  fetch(imdbUrl(item))
    .then(r => r.json())
    .then(data => {
      if(data && data.imdbRating && data.imdbRating !== "N/A"){
        imdbCache[item.id] = data.imdbRating;
        writeJSON(IMDB_CACHE_KEY, imdbCache);
        showBadge(badgeEl, data.imdbRating);
      }
    })
    .catch(() => {});
}

function showBadge(el, score){
  el.querySelector(".score").textContent = score;
  el.classList.add("show");
}
function hideBadge(el){
  if(!el) return;
  el.classList.remove("show");
  el.querySelector(".score").textContent = "";
}

// ---- input rules: one digit, optional one decimal, or 10 ----
function sanitizeScoreInput(raw){
  let v = raw.replace(/[^0-9.]/g, "");
  const firstDot = v.indexOf(".");
  if(firstDot !== -1){
    v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, "");
  }
  let [intPart, decPart] = v.split(".");
  if(intPart && intPart.length > 2) intPart = intPart.slice(0, 2);
  if(intPart && Number(intPart) > 10) intPart = "10";
  if(decPart !== undefined) decPart = decPart.slice(0, 1);
  return decPart !== undefined ? `${intPart}.${decPart}` : (intPart || "");
}

// ---- rendering ----
let activeTab = CATALOG[0].key;

function updateStats(){
  const group = CATALOG.find(g => g.key === activeTab);
  const mine = myScores();
  const vals = group.items.map(i => mine[i.id]).filter(v => v !== undefined && v !== null && v !== "");
  document.getElementById("statCount").textContent = vals.length + " / " + group.items.length;
  document.getElementById("statAvg").textContent =
    vals.length ? (vals.reduce((a,b)=>a+Number(b),0) / vals.length).toFixed(1) : "—";
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  CATALOG.forEach(group => {
    const b = document.createElement("button");
    b.className = "tab" + (group.key === activeTab ? " active" : "");
    b.textContent = group.label;
    b.onclick = () => {
      activeTab = group.key;
      document.querySelectorAll(".tab").forEach((t, idx) =>
        t.classList.toggle("active", CATALOG[idx].key === activeTab));
      document.querySelectorAll(".timeline").forEach(t =>
        t.classList.toggle("active", t.dataset.key === activeTab));
      updateStats();
      window.scrollTo(0,0);
    };
    tabsEl.appendChild(b);
  });
}

function renderAll(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const mine = myScores();
  const theirs = partnerScores();

  CATALOG.forEach(group => {
    const wrap = document.createElement("div");
    wrap.className = "timeline" + (group.key === activeTab ? " active" : "");
    wrap.dataset.key = group.key;

    if(group.items.length === 0){
      wrap.classList.add("empty");
      wrap.innerHTML = `<div class="empty-state">Nothing here yet.<br>Add films to the "${group.label}" list<br>in the file whenever you want.</div>`;
      main.appendChild(wrap);
      return;
    }

    group.items.forEach((item, i) => {
      const myVal = mine[item.id];
      const theirVal = theirs[item.id];
      const hasMine = myVal !== undefined && myVal !== null && myVal !== "";

      const card = document.createElement("div");
      card.className = "card" + (hasMine ? " rated" : "");
      card.innerHTML = `
        <div class="idx"><div class="dot"></div></div>
        <div class="poster"></div>
        <div class="info">
          <div class="title">${item.title}</div>
          <div class="year">${item.year}</div>
          <div class="rate-row">
            <input type="text" inputmode="decimal" maxlength="4" placeholder="—"
                   value="${hasMine ? myVal : ""}">
            <span class="max">/ 10</span>
            <span class="badge imdb-badge"><span class="tag">IMDb</span><span class="score"></span></span>
            <span class="badge partner-badge"><span class="tag">${partner().name}</span><span class="score"></span></span>
            <button class="clear-btn">clear</button>
          </div>
        </div>
      `;
      wrap.appendChild(card);

      const input       = card.querySelector("input");
      const imdbBadge   = card.querySelector(".imdb-badge");
      const partnerBadge= card.querySelector(".partner-badge");
      const posterEl    = card.querySelector(".poster");

      function showPartner(){
        if(theirVal !== undefined && theirVal !== null && theirVal !== ""){
          showBadge(partnerBadge, theirVal);
        }
      }

      if(hasMine){ revealImdb(item, imdbBadge); showPartner(); }

      input.addEventListener("input", () => {
        input.value = sanitizeScoreInput(input.value);
        card.classList.toggle("rated", input.value !== "");
        updateStats();
      });

      input.addEventListener("blur", () => {
        if(input.value === "") return;
        let v = Math.round(Math.max(0, Math.min(10, Number(input.value))) * 10) / 10;
        input.value = v;
        pushOne(item.id, v);
        revealImdb(item, imdbBadge);
        showPartner();
        updateStats();
      });

      card.querySelector(".clear-btn").addEventListener("click", () => {
        input.value = "";
        card.classList.remove("rated");
        hideBadge(imdbBadge);
        hideBadge(partnerBadge);
        pushOne(item.id, null);
        updateStats();
      });

      fetch("https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(item.wiki))
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if(d && d.thumbnail && d.thumbnail.source){
            posterEl.style.backgroundImage = `url("${d.thumbnail.source}")`;
          }
        })
        .catch(() => {});
    });

    main.appendChild(wrap);
  });

  document.getElementById("whoami").textContent = "you: " + me().name;
  updateStats();
}

// ---- who are you ----
function showPicker(){
  const box = document.getElementById("pickerBtns");
  box.innerHTML = "";
  PEOPLE.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.name;
    b.onclick = () => {
      meId = p.id;
      localStorage.setItem(ME_KEY, meId);
      document.getElementById("overlay").classList.remove("show");
      renderAll();
      pullFromCloud();
    };
    box.appendChild(b);
  });
  document.getElementById("overlay").classList.add("show");
}

document.getElementById("whoami").onclick = showPicker;
document.getElementById("syncBtn").onclick = pullFromCloud;

buildTabs();
if(!meId){ showPicker(); }
else { renderAll(); pullFromCloud(); }
</script>
</body>
